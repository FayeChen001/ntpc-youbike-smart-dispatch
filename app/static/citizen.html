<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>YouBike 生活圈</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><link rel="stylesheet" href="/static/common.css">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f5fa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="YouBike 生活圈">
<link rel="apple-touch-icon" href="/static/icons/icon-180.png">
<style>
:root{--ink:#16202c;--sub:#7b8794;--line2:#e8ecf1;--brandg:linear-gradient(135deg,#0f5fa8,#1478c9)}
body{background:#fff;max-width:430px;margin:0 auto;height:100vh;display:flex;flex-direction:column;overflow:hidden;color:var(--ink)}
.screen{display:none;flex:1;min-height:0;flex-direction:column}.screen.on{display:flex}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
/* 頂部 */
.top{display:flex;align-items:center;gap:8px;padding:14px 18px 8px}
.top .wx{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
.top .wx b{color:var(--ink);font-weight:600}
.top .t{margin-left:auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
h1.big{font-size:25px;margin:2px 18px 3px;letter-spacing:-.5px;line-height:1.22;font-weight:800;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{margin:0 18px 14px;color:var(--sub);font-size:12.5px}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.stuck{border-bottom-color:var(--line2)}
/* 卡片 */
.pad{padding:0 18px}
.main-card{border:1px solid var(--line2);border-radius:18px;padding:16px;box-shadow:0 1px 3px rgba(20,30,50,.04),0 8px 24px rgba(20,30,50,.05);margin-bottom:10px;background:#fff}
.main-card.pri{border-color:#cfe0f5;box-shadow:0 2px 6px rgba(15,95,168,.08),0 14px 34px rgba(15,95,168,.13)}
.main-card.pri::before{content:'';display:block;height:3px;width:38px;border-radius:2px;background:var(--brandg);margin-bottom:12px}
.tag{display:inline-block;font-size:11px;padding:3px 9px;border-radius:999px;background:#eef4fb;color:#14559b;font-weight:600}
.tag.g{background:#e8f7ef;color:#15683a}.tag.o{background:#fff3e0;color:#8a5400}.tag.r{background:#fdeaea;color:#a12626}.tag.p{background:#f0ebff;color:#4d33b8}.tag.n{background:#f2f4f7;color:#5c6775}
.eta{display:flex;align-items:baseline;gap:8px;margin:10px 0 2px}
.eta .n{font-size:40px;font-weight:800;letter-spacing:-2px;line-height:1;background:var(--brandg);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.eta .u{font-size:14px;color:var(--sub)}.eta .arr{margin-left:auto;font-size:13px;color:var(--sub)}
.steps{margin-top:12px;border-top:1px solid #eef1f5;padding-top:10px}
.step{display:flex;gap:10px;align-items:flex-start;padding:7px 0}
.step{position:relative}
.step .ic{width:28px;height:28px;border-radius:50%;background:#f2f5f9;display:flex;align-items:center;justify-content:center;font-size:14px;flex:none;z-index:1}
.steps .step:not(:last-child)::after{content:'';position:absolute;left:13.5px;top:33px;bottom:-2px;width:1.5px;background:linear-gradient(#dfe5ec,#eef1f5)}
.step .tx{flex:1;font-size:13px;line-height:1.5}.step .tx b{font-weight:600}
.step .st{font-size:11px;color:var(--sub);margin-top:1px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:middle}
.btn{display:block;width:100%;box-sizing:border-box;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;background:var(--brandg);color:#fff;cursor:pointer;
  box-shadow:0 6px 18px rgba(15,95,168,.26);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(1px);box-shadow:0 3px 10px rgba(15,95,168,.22)}
.btn.sec,.btn.warn,.btn.ghost{box-shadow:none}
.btn:active{transform:scale(.99)}.btn.sec{background:#f2f5f9;color:#2b3542}.btn.warn{background:#fff3e0;color:#8a5400}.btn.big{padding:18px;font-size:17px;border-radius:16px}
.btn.ghost{background:transparent;color:var(--sub);font-weight:500;font-size:13px;padding:10px}
.alts{margin-top:4px}
.alt{display:flex;align-items:center;gap:10px;border:1px solid #e8ecf1;border-radius:14px;padding:11px 13px;margin-bottom:8px;cursor:pointer;background:#fff}
.alt:active{background:#f8fafc}.alt .l{flex:1;min-width:0}.alt .nm{font-size:13px;font-weight:600}.alt .ds{font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alt .rt{text-align:right;font-size:12px;color:var(--sub);flex:none}.alt .rt b{display:block;font-size:16px;color:var(--ink)}
/* 附近 */
.near{border:1px solid #e8ecf1;border-radius:16px;overflow:hidden;margin-bottom:14px}
.near .hd{display:flex;align-items:center;gap:8px;padding:11px 13px;font-size:13px}
.near .hd b{font-weight:700}.near .hd .m{margin-left:auto;font-size:11px;color:var(--sub)}
#mapmini{height:150px}
.nlist{max-height:0;overflow:hidden;transition:max-height .25s}.nlist.on{max-height:320px;overflow:auto}
.nrow{display:flex;align-items:center;gap:8px;padding:9px 13px;border-top:1px solid #f0f3f6;font-size:12px}
.nrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.banner{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 13px;margin-bottom:10px;font-size:13px;line-height:1.5}
.banner.ev{background:#f5f0ff;border:1px solid #e0d7fb}.banner.rain{background:#eaf3fb;border:1px solid #cfe0f2}.banner.note{background:#fff8e8;border:1px solid #f3e0b5}
/* onboarding */
.ob{padding:26px 22px;display:flex;flex-direction:column;height:100%}
.ob .prog{display:flex;gap:5px;margin-bottom:22px}.ob .prog i{height:3px;flex:1;border-radius:2px;background:#e6eaef}.ob .prog i.on{background:#0f5fa8}
.ob h2{font-size:23px;margin:0 0 6px;letter-spacing:-.4px}.ob p.h{color:var(--sub);font-size:13px;margin:0 0 22px;line-height:1.6}
.pick{display:grid;gap:9px;margin-bottom:14px}
.opt{border:1.5px solid #e6eaef;border-radius:14px;padding:14px;cursor:pointer;display:flex;align-items:center;gap:12px;background:#fff}
.opt.sel{border-color:#0f5fa8;background:#f5f9fd}.opt .e{font-size:22px}.opt .tt{font-weight:700;font-size:14px}.opt .dd{font-size:11.5px;color:var(--sub);margin-top:2px}
select,input[type=time]{width:100%;border:1.5px solid #e6eaef;border-radius:12px;padding:12px;font:inherit;background:#fff;-webkit-appearance:none;appearance:none}
label.fl{display:block;font-size:12px;color:var(--sub);margin:14px 0 6px;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* 導航 */
#mapnav{flex:1;min-height:0}
.navbar{background:#0f5fa8;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.navbar .x{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:8px;padding:5px 9px;font-size:12px}
.navbar .ph{font-size:12px;opacity:.85}.navbar .hd2{font-size:15px;font-weight:700}
.navcard{background:#fff;border-top:1px solid #e6eaef;padding:14px 16px 16px}
.navins{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.navins .ar{font-size:30px;width:42px;text-align:center}
.navins .tx{flex:1}.navins .tx b{font-size:16px;display:block}.navins .tx span{font-size:12px;color:var(--sub)}
.navmeta{display:flex;gap:14px;font-size:12px;color:var(--sub);margin-bottom:12px}.navmeta b{color:var(--ink);font-size:15px}
.prog2{height:5px;background:#eef1f5;border-radius:3px;overflow:hidden;margin-bottom:12px}.prog2 i{display:block;height:100%;background:#0f5fa8;width:0;transition:width .3s}
/* 還車 / 報修 */
.issues{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.iss{border:1.5px solid #e6eaef;border-radius:14px;padding:15px 10px;text-align:center;cursor:pointer;background:#fff}
.iss.sel{border-color:#d64545;background:#fdf4f4}.iss .e{font-size:25px;display:block;margin-bottom:5px}.iss .t{font-size:12.5px;font-weight:600}
/* 存摺 */
.jar{text-align:center;padding:20px 18px 6px}
.jar .lb{font-size:12px;color:var(--sub)}
.jar .v{font-size:52px;font-weight:800;letter-spacing:-3px;line-height:1;margin:5px 0;background:var(--brandg);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.jar .v small{font-size:17px;font-weight:600;letter-spacing:0;margin-left:3px;color:var(--sub)}
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:12px 18px}
.mini{border:1px solid var(--line2);border-radius:14px;padding:12px 13px;background:#fff;box-shadow:0 1px 3px rgba(20,30,50,.03)}
.mini .l{font-size:11px;color:var(--sub)}.mini .v{font-size:22px;font-weight:800;margin-top:3px;letter-spacing:-.5px}.mini .v small{font-size:12px;font-weight:500;color:var(--sub)}
.ms{padding:4px 18px 0}
.msr{margin-bottom:13px}.msr .hd{display:flex;font-size:12.5px;margin-bottom:5px}.msr .hd .r{margin-left:auto;color:var(--sub);font-size:11.5px}
.bar{height:8px;background:#eef1f5;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#0aa47a,#0f5fa8);border-radius:4px}
.stamps{display:flex;flex-wrap:wrap;gap:11px;padding:6px 18px 0}
.stp{width:70px;text-align:center;font-size:10px;color:var(--sub)}
.stp i{display:block;width:58px;height:58px;border-radius:50%;border:2px solid transparent;
  background:linear-gradient(#fff,#eaf3fc) padding-box, var(--brandg) border-box;
  display:flex;align-items:center;justify-content:center;font-size:24px;font-style:normal;margin:0 auto 5px;
  box-shadow:0 3px 10px rgba(15,95,168,.16)}
.stp{font-weight:600;color:#4a5665}
.stp.lock i{background:#f5f7f9;border:2px dashed #dde2e8;box-shadow:none;filter:grayscale(1);opacity:.45}
.stp.lock{font-weight:500;color:var(--sub)}
.days{display:flex;gap:3px;align-items:flex-end;height:46px;padding:0 18px}
.days i{flex:1;background:#cfe0f2;border-radius:2px 2px 0 0;min-height:3px}.days i.hi{background:#0f5fa8}
/* 我的 */
.mrow{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid #f0f3f6;font-size:14px}
.mrow .l{flex:1}.mrow .v{color:var(--sub);font-size:13px}
/* 底部 */
nav{display:flex;border-top:1px solid #eef1f5;background:#fff;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:none;background:transparent;padding:9px 2px 10px;font-size:10.5px;color:#9aa4b2;border-radius:0;position:relative}
nav button .e{display:block;font-size:19px;margin-bottom:1px;filter:grayscale(1);opacity:.55}
nav button.on{color:#0f5fa8;font-weight:700}nav button.on .e{filter:none;opacity:1}
nav button .bdg{position:absolute;top:5px;right:calc(50% - 20px);background:#d64545;color:#fff;border-radius:999px;font-size:9px;padding:1px 5px}
.toasts{display:none}
/* 通知：頂部細長 pill，自動消失，不蓋住主要內容 */
.notice{margin:0 18px 10px;border-radius:12px;padding:9px 12px;font-size:12.5px;line-height:1.45;display:flex;gap:9px;align-items:flex-start;
  background:#eef4fb;border:1px solid #cfe0f2;animation:drop .22s ease-out}
.notice.warn{background:#fff6e8;border-color:#f2dcae}.notice.reward{background:#eaf8f0;border-color:#c6e8d5}
.notice .x{margin-left:auto;color:var(--sub);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
@keyframes drop{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.bell{position:relative;font-size:16px;cursor:pointer;padding:2px 4px;filter:grayscale(1);opacity:.6}
.bell.has{filter:none;opacity:1}
.bell b{position:absolute;top:-3px;right:-4px;background:#d64545;color:#fff;border-radius:999px;font-size:9px;padding:1px 4px;font-weight:700}
/* 目的地輸入 */
.dest{margin:0 18px 10px}
.destbox{display:flex;align-items:center;gap:8px;border:1.5px solid #e2e7ee;border-radius:14px;padding:12px 13px;background:#fff}
.destbox:focus-within{border-color:#0f5fa8;box-shadow:0 0 0 3px #e6f0fa}
.destbox input{flex:1;border:none;outline:none;font:inherit;font-size:15px;background:transparent;min-width:0}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip2{flex:none;border:1px solid #e2e7ee;border-radius:999px;padding:6px 12px;font-size:12.5px;background:#fff;cursor:pointer;white-space:nowrap}
.chip2.on{border-color:#0f5fa8;background:#eef4fb;color:#14559b;font-weight:600}
.sug{border:1px solid #e2e7ee;border-radius:12px;margin-top:6px;overflow:hidden;background:#fff;box-shadow:0 6px 18px rgba(20,30,50,.08)}
.sug div{padding:11px 13px;border-bottom:1px solid #f2f4f7;cursor:pointer;font-size:13.5px}
.sug div:last-child{border:none}.sug div:active{background:#f6f9fc}.sug .s2{font-size:11px;color:var(--sub);margin-top:2px}
.fromline{margin:0 18px 10px;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fromline b{color:var(--ink);font-weight:600}
.fromline .edit{color:#0f5fa8;cursor:pointer}
/* 方案切換：顯眼的三段式 */
.seg{display:flex;gap:6px;margin:0 18px 10px}
.seg button{flex:1;border:1.5px solid var(--line2);background:#fff;border-radius:14px;padding:11px 4px 10px;text-align:center;cursor:pointer;line-height:1.25;
  transition:transform .12s,border-color .12s,background .12s;position:relative}
.seg button:active{transform:scale(.97)}
.seg button .e{display:block;font-size:17px;margin-bottom:2px}
.seg button .t{font-size:12px;font-weight:700;color:var(--ink)}
.seg button .m{font-size:10.5px;color:var(--sub);margin-top:1px}
.seg button.on{border-color:transparent;background:var(--brandg);box-shadow:0 6px 16px rgba(15,95,168,.28)}
.seg button.on .t,.seg button.on .m{color:#fff}
.seg button.on .m{opacity:.85}
.seg button:disabled{opacity:.38;cursor:default}
.seg button .same{position:absolute;top:5px;right:7px;font-size:9px;color:var(--sub);background:#f2f4f7;border-radius:999px;padding:1px 5px}
.seg button.on .same{color:#fff;background:rgba(255,255,255,.22)}
.hint{font-size:11px;color:var(--sub);line-height:1.6;padding:10px 18px 20px}
.sk{background:linear-gradient(90deg,#eef1f5 25%,#f6f8fa 37%,#eef1f5 63%);background-size:400% 100%;animation:shim 1.3s infinite;border-radius:8px}
@keyframes shim{0%{background-position:100% 50%}100%{background-position:0 50%}}
.sk-line{height:12px;margin-bottom:9px}.sk-big{height:38px;width:45%;margin-bottom:14px}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:#fff;border-radius:20px 20px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);z-index:900;transform:translateY(101%);transition:.25s;padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}.sheet h3{margin:0 0 4px;font-size:18px}.sheet p{margin:0 0 14px;color:var(--sub);font-size:13px}
.backdrop{position:fixed;inset:0;background:rgba(10,18,28,.35);z-index:850;display:none}.backdrop.on{display:block}
</style></head><body>

<!-- 設定 -->
<section class="screen on" id="s-onboard"><div class="ob">
  <div class="prog"><i class="on"></i><i></i><i></i></div>
  <div id="ob-body" style="flex:1"></div>
  <button class="btn" id="ob-next" onclick="obNext()">下一步</button>
  <button class="btn ghost" id="ob-back" onclick="obBack()" style="display:none">上一步</button>
</div></section>

<!-- 現在 -->
<section class="screen" id="s-home">
  <div class="top" id="top-bar"><div class="wx" id="wx">—</div><div class="t" id="clock">—</div><span class="bell" id="bell" onclick="openNotifs()">🔔<b id="bell-n" style="display:none">0</b></span></div>
  <div class="scroll">
    <div id="notices"></div>
    <h1 class="big" id="greet">早安</h1><p class="sub" id="greet2"></p>
    <div class="dest">
      <div class="destbox"><span>🔍</span><input id="dest-input" placeholder="要去哪裡？輸入地點或站名" autocomplete="off"
        oninput="onDestInput()" onfocus="onDestInput()"><span id="dest-clear" style="display:none;cursor:pointer;color:var(--sub)" onclick="clearDest()">✕</span></div>
      <div id="sug"></div>
      <div class="chips" id="dest-chips"></div>
    </div>
    <div class="fromline" id="fromline"></div>
    <div class="seg" id="seg"></div>
    <div class="pad" id="home-body"></div>
    <div class="hint" id="home-hint"></div>
  </div>
</section>

<!-- 導航 -->
<section class="screen" id="s-nav">
  <div class="navbar"><button class="x" onclick="exitNav()">結束</button><div style="flex:1"><div class="ph" id="nav-phase">前往借車站</div><div class="hd2" id="nav-target">—</div></div><span id="nav-extra"></span></div>
  <div id="mapnav"></div>
  <div class="navcard" id="nav-card"></div>
</section>

<!-- 存摺 -->
<section class="screen" id="s-wallet"><div class="scroll" id="wallet-body"></div></section>

<!-- 我的 -->
<section class="screen" id="s-me"><div class="scroll" id="me-body"></div></section>

<nav id="nav-bar" style="display:none">
  <button class="on" data-s="home" onclick="go('home')"><span class="e">🧭</span>現在</button>
  <button data-s="wallet" onclick="go('wallet')"><span class="e">🏦</span>存摺</button>
  <button data-s="me" onclick="go('me')"><span class="e">👤</span>我的</button>
</nav>

<div class="backdrop" id="bd" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script><script src="/static/common.js"></script>
<script>
const $=id=>document.getElementById(id);
let S={profile:null,places:null,plan:null,near:null,wx:null,clock:null,trip:null,screen:'home',obStep:0,ob:{},
       sel:0,issues:[],navTimer:null,navProg:0,legIdx:0,legs:[],dest:null,origin:null,notices:[],unread:0,
       deferredInstall:null,searchTimer:null};
let mapMini=null, mapNav=null, navLayers=[], meMarker=null;
const KIND={fast:{e:'⚡',t:'最快',m:'時間最短'},reliable:{e:'🛡',t:'最穩',m:'借還風險低'},reward:{e:'🏅',t:'集點',m:'獎勵最多'}};

/* ================= 設定流程 ================= */
const OB=[
 ()=>`<h2>你是？</h2><p class="h">決定預設的通勤時間與任務類型。之後都能改。</p>
  <div class="pick">${[['worker','🧑‍💼','上班族','住家與辦公室之間通勤'],['student','🎒','學生','上下學，放學可接順路任務']].map(([k,e,t,d])=>
    `<div class="opt ${S.ob.role===k?'sel':''}" onclick="S.ob.role='${k}';obRender()"><div class="e">${e}</div><div><div class="tt">${t}</div><div class="dd">${d}</div></div></div>`).join('')}</div>`,
 ()=>{const P=S.places, w=S.ob.role==='student'?'school':'work';
  return `<h2>常去的兩個地方</h2><p class="h">設好之後，每次出門只要輸入其他目的地就好。</p>
  <label class="fl">住家附近</label><select id="ob-home">${P.home.map(p=>`<option value="${p.sid}" ${S.ob.home_sid==p.sid?'selected':''}>${p.name}（${p.district}）</option>`).join('')}</select>
  <label class="fl">${S.ob.role==='student'?'學校':'上班地點'}</label><select id="ob-work">${P[w].map(p=>`<option value="${p.sid}" ${S.ob.work_sid==p.sid?'selected':''}>${p.name}（${p.district}）</option>`).join('')}</select>
  <div class="row2"><div><label class="fl">${S.ob.role==='student'?'上學':'上班'}出門</label><input type="time" id="ob-out" value="${S.ob.out_time}"></div>
  <div><label class="fl">回家</label><input type="time" id="ob-back" value="${S.ob.back_time}"></div></div>`;},
 ()=>`<h2>集點計劃</h2><p class="h">把車借還到系統預測會缺車或滿站的地方，可以拿點數與城市章。</p>

function drawMini(){ const n=S.near,o=S.plan&&S.plan.options&&S.plan.options[S.sel]; const box=$('mapmini'); if(!n||!box) return;

    .bindTooltip(`${s.name}<br>${s.ease.text}・可借 ${s.bikes??'–'} 輛／可還 ${s.spaces??'–'} 位`); m.addTo(mapMini); g.push(m); });
  (n.events||[]).forEach(e=>{ const m=L.marker([e.lat,e.lon],{icon:L.divIcon({className:'',html:'<div style="font-size:20px">🎤</div>',iconSize:[20,20]})}).bindTooltip(e.title); m.addTo(mapMini); g.push(m); });

async function pollExplain(eid){ for(let k=0;k<14;k++){ await new Promise(r=>setTimeout(r,700));
  try{ const e=await API.get('/api/explain/'+eid); if(e.ready){ const rr=e.reasons&&e.reasons[S.sel];
      const txt = typeof rr==='string'? rr : (rr && (rr.reason||rr.text||rr.description)) || null;
      if(txt && $('reason')) $('reason').innerHTML=`${txt} ${srcBadge(e.source)}`; return; } }catch(err){ return; } } }

/* ================= 導航 ================= */
function cumDist(g){ let d=[0]; for(let i=1;i<g.length;i++){ const a=g[i-1],b=g[i]; const dx=(b[1]-a[1])*101000*Math.cos(a[0]*Math.PI/180), dy=(b[0]-a[0])*111000; d.push(d[i-1]+Math.hypot(dx,dy)); } return d; }
function ptAt(g,cd,m){ if(m<=0) return g[0]; if(m>=cd[cd.length-1]) return g[g.length-1];
  let i=1; while(cd[i]<m) i++; const t=(m-cd[i-1])/Math.max(cd[i]-cd[i-1],1e-6); return [g[i-1][0]+(g[i][0]-g[i-1][0])*t, g[i-1][1]+(g[i][1]-g[i-1][1])*t]; }
async function startTrip(){ const o=S.plan.options[S.sel];
  S.trip=await API.post('/api/trip/start',{option:o,all_labels:S.plan.options.map(x=>x.kind)});
  $('nav-card').innerHTML='<div class="muted small">取得路線指示…</div>'; go('nav');
  const [l1,l2,l3]=await Promise.all([
    API.get(`/api/nav_route?from_lat=${S.origin.lat}&from_lon=${S.origin.lon}&to_lat=${o.borrow.lat}&to_lon=${o.borrow.lon}&mode=walk`),
    API.get(`/api/nav_route?from_lat=${o.borrow.lat}&from_lon=${o.borrow.lon}&to_lat=${o.return.lat}&to_lon=${o.return.lon}&mode=ride`),
    API.get(`/api/nav_route?from_lat=${o.return.lat}&from_lon=${o.return.lon}&to_lat=${S.dest.lat}&to_lon=${S.dest.lon}&mode=walk`)]);
  S.legs=[{...l1,kind:'walk',to:o.borrow.name},{...l2,kind:'ride',to:o.return.name},{...l3,kind:'walk',to:S.dest.title.replace(' 一帶','')}];
  S.legs.forEach(l=>{ l.cd=cumDist(l.geometry); l.total=l.cd[l.cd.length-1]||l.dist_m; });
  S.legIdx=0; S.navProg=0; startLeg(); }
function startLeg(){ const l=S.legs[S.legIdx]; const nb=$('mapnav');
  if(mapNav && mapNav.getContainer() !== nb){ try{ mapNav.remove(); }catch(e){} mapNav=null; navLayers=[]; }
  if(!mapNav) mapNav=makeMap('mapnav',l.geometry[0],16,{layerToggle:false});
  navLayers.forEach(x=>mapNav.removeLayer(x)); navLayers=[];
  const col=l.kind==='ride'?'#0f5fa8':'#7b8794';
  const line=L.polyline(l.geometry,{color:col,weight:6,opacity:.85,dashArray:l.kind==='walk'?'1 9':null,lineCap:'round'}).addTo(mapNav); navLayers.push(line);
  navLayers.push(L.circleMarker(l.geometry[l.geometry.length-1],{radius:9,color:'#fff',weight:3,fillColor:l.kind==='ride'?'#0aa47a':'#0f5fa8',fillOpacity:1}).bindTooltip(l.to).addTo(mapNav));
  meMarker=L.circleMarker(l.geometry[0],{radius:8,color:'#fff',weight:3,fillColor:'#1d6ff2',fillOpacity:1}).addTo(mapNav); navLayers.push(meMarker);
  mapNav.fitBounds(line.getBounds().pad(.18));
  $('nav-phase').textContent=['前往借車站','騎乘中','前往目的地'][S.legIdx];
  $('nav-target').textContent=l.to; $('nav-extra').innerHTML = S.legIdx===1? `<button class="x" onclick="reportDuringRide()">車況異常</button>`:'';
  S.navProg=0; renderNav(); playNav(); }
function playNav(){ clearInterval(S.navTimer); const l=S.legs[S.legIdx]; const dur=9000,tick=120;
  S.navTimer=setInterval(()=>{ S.navProg=Math.min(1,S.navProg+tick/dur);
    const m=l.total*S.navProg, pt=ptAt(l.geometry,l.cd,m); if(meMarker) meMarker.setLatLng(pt); mapNav.panTo(pt,{animate:true,duration:.1});
    renderNav(); if(S.navProg>=1){ clearInterval(S.navTimer); S.navTimer=null; arriveLeg(); } },tick); }
function pauseNav(){ clearInterval(S.navTimer); S.navTimer=null; renderNav(); }
function renderNav(){ const l=S.legs[S.legIdx]; const done=l.total*S.navProg, left=Math.max(0,l.total-done);
  let cum=0,cur=(l.steps&&l.steps[0])||{text:'直行',dist_m:l.total};
  for(const st of (l.steps||[])){ if(done<cum+st.dist_m){ cur=st; break; } cum+=st.dist_m; }
  const stepLeft=Math.max(0,Math.round(cum+(cur.dist_m||0)-done));
  const arrow=/左/.test(cur.text)?'↰':/右/.test(cur.text)?'↱':/抵達/.test(cur.text)?'🏁':'↑';
  $('nav-card').innerHTML=`
   <div class="navins"><div class="ar">${arrow}</div><div class="tx"><b>${cur.text}</b><span>${stepLeft} 公尺後</span></div></div>
   <div class="prog2"><i style="width:${(S.navProg*100).toFixed(0)}%"></i></div>
   <div class="navmeta"><span>剩餘 <b>${left<1000?Math.round(left)+' m':(left/1000).toFixed(1)+' km'}</b></span><span>約 <b>${Math.max(0,Math.round(l.minutes*(1-S.navProg)))}</b> 分</span><span style="margin-left:auto">${l.kind==='ride'?'🚲 騎乘':'🚶 步行'}</span></div>
   <div style="display:flex;gap:8px">
     <button class="btn sec" style="flex:1 1 0;width:auto;white-space:nowrap;padding:14px 6px;font-size:14px" onclick="${S.navTimer?'pauseNav()':'playNav()'}">${S.navTimer?'⏸ 暫停':'▶ 繼續'}</button>
     <button class="btn sec" style="flex:1 1 0;width:auto;white-space:nowrap;padding:14px 6px;font-size:14px" onclick="skipLeg()">跳到終點</button>
     <button class="btn sec" style="flex:0 0 56px;width:56px;padding:14px 0;font-size:17px" onclick="gmaps()" title="用 Google 地圖導航">🗺</button></div>
   <div class="hint" style="padding:9px 0 0">模擬導航播放。轉彎指示與路線來自 ${l.source}；實際騎乘請用下方地圖 App。</div>`; }
function skipLeg(){ clearInterval(S.navTimer); S.navTimer=null; S.navProg=1; renderNav(); arriveLeg(); }
function gmaps(){ const l=S.legs[S.legIdx]; const a=l.geometry[0],b=l.geometry[l.geometry.length-1];
  window.open(`https://www.google.com/maps/dir/?api=1&origin=${a[0]},${a[1]}&destination=${b[0]},${b[1]}&travelmode=${l.kind==='ride'?'bicycling':'walking'}`,'_blank'); }

/* ---- 借車站：借車 or 這台有問題 ---- */
async function arriveLeg(){ const o=S.trip.option;
  if(S.legIdx===0){ await API.post('/api/trip/phase',{phase:'at_borrow'}); borrowScreen(); return; }
  if(S.legIdx===1){ await API.post('/api/trip/phase',{phase:'at_return'}); returnScreen(); return; }
  finishTrip(); }
function borrowScreen(){ const o=S.trip.option;
  $('nav-phase').textContent='借車'; $('nav-target').textContent=o.borrow.name; $('nav-extra').innerHTML='';
  $('nav-card').innerHTML=`<div class="navins"><div class="ar">🚲</div><div class="tx"><b>到了 ${o.borrow.name}</b><span>現場可借 ${o.borrow.bikes_now??'–'} 輛・系統指派車號 ${S.trip.bike_no}</span></div></div>
    <button class="btn big" onclick="borrowed()">借這台，開始騎乘</button>
    <button class="btn warn" style="margin-top:9px" onclick="openIssues('before_borrow')">這台車有問題，換一台</button>
    <div class="hint" style="padding:9px 0 0">借車前先檢查煞車、輪胎與坐墊。回報後系統會幫你換下一台，故障車也會提早退出流通。</div>`; }
async function borrowed(){ await API.post('/api/trip/phase',{phase:'riding'}); S.legIdx=1; startLeg(); }
function reportDuringRide(){ pauseNav(); openIssues('riding'); }
function returnScreen(){ const o=S.trip.option;
  $('nav-phase').textContent='還車'; $('nav-target').textContent=o.return.name; $('nav-extra').innerHTML='';
  $('nav-card').innerHTML=`<div class="navins"><div class="ar">🅿️</div><div class="tx"><b>到了 ${o.return.name}</b><span>目前 ${o.return.spaces_now??'–'} 個空位・車號 ${S.trip.bike_no}</span></div></div>
    <button class="btn big" onclick="finishTrip()">完成還車</button>
    <button class="btn warn" style="margin-top:9px" onclick="openIssues('after_return')">這台車騎起來有問題</button>`; }
const STAGE={before_borrow:{t:'這台車哪裡有問題？',p:'回報後幫你換下一台，微笑單車會立刻收到工單。'},
             riding:{t:'車況哪裡不對？',p:'先記錄下來，到站再處理。不要在騎乘中操作手機。'},
             after_return:{t:'這台車哪裡有問題？',p:'你剛騎完最清楚。回報經店家驗收後可得維修回報章。'}};
function openIssues(stage){ const s=STAGE[stage];
  openSheet(`<h3>${s.t}</h3><p>${s.p}　車號 ${S.trip?S.trip.bike_no:''}</p>
  <div class="issues">${S.issues.map(i=>`<div class="iss" onclick="sendIssue('${stage}','${i.label}')"><span class="e">${i.icon}</span><span class="t">${i.label}</span></div>`).join('')}</div>
  <button class="btn ghost" style="margin-top:10px" onclick="closeSheet();${stage==='riding'?'playNav()':''}">先不回報</button>
  <div class="hint" style="padding:8px 0 0">請不要騎乘故障車送修。</div>`); }
async function sendIssue(stage,label){
  const r=await API.post('/api/trip/report_bike',{stage,issue:label}); S.trip=r.trip; closeSheet();
  if(stage==='before_borrow'){
    pushNotice({title:'已回報並換車',body:`${label}｜原車號 ${r.old_bike} 已建立工單，改配 ${r.new_bike}`,kind:'ticket',ts:S.clock.ts});
    borrowScreen();
  } else if(stage==='riding'){
    pushNotice({title:'已記錄車況',body:`${label}。到站還車後會一併送出。`,kind:'ticket',ts:S.clock.ts}); playNav();
  } else {
    pushNotice({title:'已回報',body:`${label}｜微笑單車已收到工單`,kind:'ticket',ts:S.clock.ts});
    $('nav-card').innerHTML=`<div class="navins"><div class="ar">✅</div><div class="tx"><b>已回報：${label}</b><span>微笑單車端已收到工單</span></div></div><button class="btn big" onclick="finishTrip()">完成還車</button>`; } }
async function finishTrip(){ clearInterval(S.navTimer); S.navTimer=null; const r=await API.post('/api/trip/finish',{}); const rep=(S.trip&&S.trip.reports)||[]; S.trip=null;
  openSheet(`<h3>還車完成 🎉</h3><p>本趟已計入存摺${rep.length?`，含 ${rep.length} 次有效車況回報`:''}。</p>
    <div class="grid4" style="padding:0 0 12px"><div class="mini"><div class="l">獲得點數</div><div class="v">+${r.points}</div></div>
    <div class="mini"><div class="l">獲得徽章</div><div class="v" style="font-size:15px">${r.stamp.name}</div></div></div>
    <button class="btn" onclick="closeSheet();go('wallet')">看我的存摺</button>
    <button class="btn ghost" onclick="closeSheet();go('home');refreshHome()">回首頁</button>`); }
function exitNav(){ clearInterval(S.navTimer); S.navTimer=null; go('home'); }

/* ================= 存摺 ================= */
async function loadWallet(){ const w=await API.get('/api/wallet'); const mx=Math.max(...w.by_day.map(d=>d.km),1);
  $('wallet-body').innerHTML=`
  <div class="jar">${w.demo_seed?`<div class="tag n" style="margin-bottom:6px">示範帳戶：本月 ${w.sim_trips} 趟為模擬紀錄，${w.real_trips} 趟為本次操作</div>`:''}<div class="lb">${w.month.replace('-','年')}月　累積騎乘</div><div class="v">${w.km}<small>公里</small></div>
    <div class="lb">${w.trips} 趟・連續 ${w.streak_days} 天</div>
    <div class="days" style="margin-top:12px">${w.by_day.map(d=>`<i class="${d.km>=mx*0.9?'hi':''}" style="height:${Math.max(8,d.km/mx*46)}px" title="${d.date} ${d.km} km"></i>`).join('')}</div></div>
  <div class="grid4">
    <div class="mini"><div class="l">🌱 減碳</div><div class="v">${w.co2_kg}<small> 公斤</small></div></div>
    <div class="mini"><div class="l">💰 省下</div><div class="v">${w.saved_ntd}<small> 元</small></div></div>
    <div class="mini"><div class="l">🪙 點數</div><div class="v">${w.points}<small> 點</small></div></div>
    <div class="mini"><div class="l">🔥 連續</div><div class="v">${w.streak_days}<small> 天</small></div></div></div>
  <div class="ms"><div style="font-size:13px;font-weight:700;margin:8px 0 10px">里程碑</div>
    ${w.milestones.map(m=>`<div class="msr"><div class="hd"><span>${m.icon} ${m.label}</span><span class="r">${typeof m.now==='number'?(m.goal<=5?m.now.toFixed(2):m.now.toFixed(m.goal>=50?1:0)):m.now} / ${m.goal}</span></div><div class="bar"><i style="width:${m.pct}%"></i></div></div>`).join('')}</div>
  <div style="font-size:13px;font-weight:700;margin:8px 18px 6px">城市圖鑑</div>
  <div class="stamps">${[...w.stamps.map(s=>({n:s.name,e:{district:'🏙️',landmark:'📍',event:'🎤',relay:'🤝',service:'🔧'}[s.type]||'⭐',got:1})),
      ...['板橋區生活圈章','新莊區生活圈章','土城區生活圈章','維修回報章','放學接力章'].filter(n=>!w.stamps.some(s=>s.name===n)).map(n=>({n,e:'🏙️',got:0}))]
      .slice(0,10).map(s=>`<div class="stp ${s.got?'':'lock'}"><i>${s.e}</i>${s.n}</div>`).join('')}</div>
  ${w.coupons.length?`<div style="font-size:13px;font-weight:700;margin:16px 18px 6px">優惠券 <span class="tag p">兌付為模擬</span></div>
    ${w.coupons.map(c=>`<div style="margin:0 18px 8px" class="mini"><b>${c.title}</b><div class="l" style="margin-top:3px">${c.note}</div></div>`).join('')}`:''}
  <div class="hint">${Object.entries(w.assumptions).map(([k,v])=>`${k.replace(/_/g,' ')}：${v}`).join('<br>')}</div>`; }

/* ================= 我的 ================= */
async function loadMe(){ const p=await API.get('/api/profile'); S.profile=p; const PR={time:'準時抵達',reliable:'一定借得到',reward:'多集點'};
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  $('me-body').innerHTML=`<h1 class="big" style="margin-top:16px">我的設定</h1><div style="height:8px"></div>
  <div class="mrow"><div class="l">身分</div><div class="v">${p.role==='student'?'學生':'上班族'}</div></div>
  <div class="mrow"><div class="l">住家附近</div><div class="v">${p.home?p.home.name:'—'}</div></div>
  <div class="mrow"><div class="l">${p.role==='student'?'學校':'上班地點'}</div><div class="v">${p.work?p.work.name:'—'}</div></div>
  <div class="mrow"><div class="l">出門／回家</div><div class="v">${p.out_time}／${p.back_time}</div></div>
  <div class="mrow"><div class="l">預設先看</div><div class="v">${PR[p.preference]}</div></div>
  <div class="mrow"><div class="l">集點計劃</div><div class="v">${p.join_rewards?'已加入':'未加入'}</div></div>
  <div class="mrow"><div class="l">願意步行上限</div><div class="v">${p.max_walk_min} 分鐘</div></div>
  <div style="padding:16px 18px">
    <button class="btn sec" onclick="editPref()">改變預設推薦</button>
    <button class="btn sec" style="margin-top:8px" onclick="reportPassingBike()">回報路過看到的故障車</button>
    <button class="btn" style="margin-top:8px" onclick="installApp()">加到手機或桌面主畫面</button>
    <button class="btn ghost" style="margin-top:8px" onclick="S.obStep=0;S.ob={...S.ob,role:p.role,home_sid:p.home_sid,work_sid:p.work_sid,out_time:p.out_time,back_time:p.back_time,join_rewards:p.join_rewards,preference:p.preference};go('onboard');obRender()">重新設定常用地點</button></div>
  <div class="hint">通知為頁內模擬推播，不是手機系統推播。${ios?'iPhone 請用 Safari 分享選單的「加入主畫面」。':''}</div>`; }
function editPref(){ const PR=[['time','⏱','準時抵達'],['reliable','🛡','一定借得到'],['reward','🎯','多集點']];
  openSheet(`<h3>預設先看哪一種</h3><p>三種方案每次都看得到，這只決定預設。</p><div class="pick">${PR.map(([k,e,t])=>`<div class="opt ${S.profile.preference===k?'sel':''}" onclick="setPref('${k}')"><div class="e">${e}</div><div class="tt">${t}</div></div>`).join('')}</div>`); }
async function setPref(k){ S.profile=await API.post('/api/profile',{preference:k}); closeSheet(); loadMe(); pushNotice({title:'已更新',body:'下次規劃會用新的預設',kind:'info',ts:S.clock.ts}); }
async function reportPassingBike(){
  const near=await API.get(`/api/nearby?lat=${S.profile.home_pos[0]}&lon=${S.profile.home_pos[1]}&r=900`);
  openSheet(`<h3>回報路過的故障車</h3><p>不是你正在租借的車也可以回報。</p>
    <label class="fl">在哪一站</label><select id="pb-sid">${near.stations.slice(0,12).map(s=>`<option value="${s.sid}">${s.name}（走 ${Math.round(s.walk_min)} 分）</option>`).join('')}</select>
    <label class="fl">車號（選填）</label><input id="pb-bike" placeholder="車身號碼" style="width:100%;border:1.5px solid #e6eaef;border-radius:12px;padding:12px;font:inherit">
    <label class="fl">問題</label>
    <div class="issues" style="grid-template-columns:repeat(2,1fr)">${S.issues.map(i=>`<div class="iss" onclick="sendPassing('${i.label}')"><span class="e">${i.icon}</span><span class="t">${i.label}</span></div>`).join('')}</div>`); }
async function sendPassing(label){ const sid=+$('pb-sid').value, bike=$('pb-bike').value;
  await API.post('/api/tickets',{sid,bike_no:bike,issue:label,note:'路過回報'}); closeSheet();
  pushNotice({title:'已回報',body:`${label}。微笑單車已收到工單。`,kind:'ticket',ts:S.clock.ts}); }

/* ================= PWA ================= */
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); S.deferredInstall=e; });
async function installApp(){
  if(S.deferredInstall){ S.deferredInstall.prompt(); const r=await S.deferredInstall.userChoice; S.deferredInstall=null;
    pushNotice({title:r.outcome==='accepted'?'已加入主畫面':'已取消',body:r.outcome==='accepted'?'之後可以從主畫面直接開啟':'隨時可以再從這裡加入',kind:'info',ts:S.clock.ts}); return; }
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  openSheet(`<h3>加到主畫面</h3><p>加入後就像一般 App，可以從主畫面或桌面直接開啟。</p>
   <div style="font-size:13.5px;line-height:1.9">
    <b>iPhone / iPad（Safari）</b><br>點下方分享按鈕，選「加入主畫面」。<br><br>
    <b>Android（Chrome）</b><br>右上角選單選「安裝應用程式」或「加到主畫面」。<br><br>
    <b>電腦（Chrome / Edge）</b><br>網址列右側的安裝圖示，或選單裡的「安裝」。</div>
   <button class="btn" style="margin-top:12px" onclick="closeSheet()">知道了</button>`); }
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});

/* ================= 事件 ================= */
connectEvents({
  tick:(p)=>{ S.clock=p.clock; $('clock').textContent='回放 '+p.clock.ts.slice(5); },
  notify:(n)=>{ if(n.channel!=='citizen') return; pushNotice(n);
    if(n.kind==='reminder'&&n.extra&&n.extra.plan&&S.screen==='home'){ S.plan=n.extra.plan; S.wx=n.extra.plan.weather; S.sel=0; renderWx(); renderHome(); } },
  scenario: async ()=>{ await boot(true); },
  wallet:()=>{ if(S.screen==='wallet') loadWallet(); }
});

async function boot(reload){
  const [p,places,iss]=await Promise.all([API.get('/api/profile'),API.get('/api/places'),API.get('/api/issues')]);
  S.profile=p; S.places=places; S.issues=iss.issues;
  const st=await API.get('/api/state'); S.clock=st.clock; $('clock').textContent='回放 '+st.clock.ts.slice(5);
  const w=await API.get('/api/weather'); S.wx=w.replay; renderWx();
  const t=await API.get('/api/trip'); S.trip=t.active?t:null;
  if(!p.onboarded){ S.ob={role:'worker',home_sid:null,work_sid:null,out_time:'07:40',back_time:'18:10',join_rewards:true,preference:'time'}; go('onboard'); obRender(); return; }
  $('nav-bar').style.display=''; S.dest=null; setDefaultOD();
  const q=new URLSearchParams(location.search);
  if(q.get('tab')==='wallet'){ go('wallet'); } else go('home');
  await refreshHome();
  if(p.pref_prompt) openSheet(`<h3>要把預設換成「${p.pref_prompt.label}」嗎？</h3><p>你連續兩次都挑了這個方案。</p>
    <button class="btn" onclick="setPref('${p.pref_prompt.kind}')">好，換成這個</button><button class="btn ghost" onclick="closeSheet()">維持現在的</button>`);
}
document.querySelectorAll('.scroll').forEach(el=>el.addEventListener('scroll',()=>{ $('top-bar') && $('top-bar').classList.toggle('stuck', el.scrollTop>4); }));
boot();
</script></body></html>
