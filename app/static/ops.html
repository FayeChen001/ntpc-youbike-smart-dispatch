<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>微笑單車調度中心｜即時作戰室</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><link rel="stylesheet" href="/static/common.css">
<style>
body{height:100vh;display:flex;flex-direction:column;overflow:hidden;background:#eef1f6}
header{display:flex;align-items:center;gap:9px;padding:6px 12px;background:#1d2430;color:#fff;flex:none}
header h1{font-size:14px;margin:0;white-space:nowrap}header .clock{font-weight:700;color:#9fd3ff;font-variant-numeric:tabular-nums;white-space:nowrap}
header .scen{font-size:12px;color:#9aa7b8;white-space:nowrap}
header button{background:#2b3545;border-color:#3c4859;color:#dfe6ef}header button:hover{border-color:#5d6c80}
header .seg button.on{background:#0f5fa8;border-color:#0f5fa8;color:#fff}
.toasts{top:auto;bottom:12px}
.panel{margin:0 12px 7px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);flex:none}
.ptitle{display:flex;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600}
.ptitle .lg{margin-left:auto;font-weight:400;color:var(--muted);font-size:11px;display:flex;gap:9px;align-items:center}
.ptitle .lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:3px;vertical-align:middle}
.citywrap{display:flex;gap:8px;padding:6px 10px}
.cells{display:flex;gap:4px;overflow-x:auto;flex:1;padding-bottom:3px}
.cell{flex:none;width:56px;border:1px solid var(--line);border-radius:8px;padding:3px 4px;text-align:center;cursor:pointer;background:#fafbfd}
.cell:hover{border-color:#9dc0e8}.cell.foc{background:#fff;border-color:#b9cbe2;box-shadow:inset 0 0 0 1px #e3ecf7}.cell.on{box-shadow:0 0 0 2px #0f5fa8}
.cell .nm{font-size:11px;color:#3a4553;white-space:nowrap;overflow:hidden}
.cell .rt{font-size:15px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}.cell .rt .pc{font-size:9px;font-weight:400}
.cell .bar{height:3px;background:#eef1f5;border-radius:2px;margin:2px 0}.cell .bar i{display:block;height:100%;background:#8a94a3;border-radius:2px}
.cell .tk{font-size:10px;color:#3a4553;white-space:nowrap}.cell .tk .lv{margin-left:3px}
.citysum{width:300px;flex:none;font-size:11.5px;line-height:1.6;border-left:1px solid var(--line);padding-left:9px}
.kpis{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;padding:0 12px 6px;flex:none}
.kpi{padding:5px 8px}.kpi .v{font-size:19px}.kpi .l{font-size:11px}.kpi .s{font-size:10px;line-height:1.35}
.gantt{padding:4px 10px 7px;max-height:278px;overflow-y:auto}
.grow{display:flex;align-items:center;height:20px}
.glabel{width:150px;flex:none;font-size:11px;color:#3a4553;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden}
.glabel .cst{font:inherit;font-size:10px;padding:0 2px;border:1px solid var(--line);border-radius:5px;background:#fff;color:#5c6775}
.gtrack{flex:1;position:relative;height:18px;border-radius:4px;background:#f4f6f9}.gtrack.idle{background:#f8fafc}
.idlebar{position:absolute;left:0;right:0;top:1px;height:16px;line-height:16px;font-size:10px;color:var(--muted);padding:0 6px;display:flex;gap:4px;align-items:center;white-space:nowrap;overflow:hidden;z-index:2}
.idlebar .cst{font:inherit;font-size:9px;padding:0 2px;border:1px solid var(--line);border-radius:4px;background:#fff}
.gtrack.off{background:repeating-linear-gradient(45deg,#f4f6f9,#f4f6f9 4px,#eceff4 4px,#eceff4 8px)}
.ghead .gtrack{background:transparent;height:16px}
.gtick{position:absolute;top:0;border-left:1px solid #dde3eb;font-size:10px;color:var(--muted);padding-left:3px;height:14px}
.ggrid{position:absolute;top:0;bottom:0;border-left:1px solid #e9edf3;z-index:0}
.gnow{position:absolute;top:-2px;bottom:0;width:2px;background:var(--bad);z-index:5}
.gnow b{position:absolute;top:-15px;left:3px;font-size:10px;font-weight:700;color:var(--bad);background:#fff;padding:0 3px;border-radius:3px;white-space:nowrap}
.gbar{position:absolute;top:1px;height:16px;border-radius:4px;background:var(--brand);color:#fff;font-size:10px;line-height:16px;padding:0 4px;overflow:hidden;white-space:nowrap;cursor:pointer;z-index:3;box-shadow:0 1px 2px rgba(0,0,0,.18)}
.gbar.dispatched,.gbar.en_route{background:var(--sim)}.gbar.late{background:var(--bad)}.gbar.mover{background:var(--brand2)}.gbar.repair{background:#8a5fd0}
.gbar.sel{outline:2px solid #1d2430;outline-offset:1px}
.gdl{position:absolute;top:-1px;height:20px;width:0;border-left:2px dotted #2b3545;z-index:4}
.gchip{position:absolute;top:1px;height:16px;line-height:16px;font-size:10px;padding:0 5px;border-radius:4px;background:#fde8e8;color:#a12626;border:1px solid #f6c4c4;cursor:pointer;white-space:nowrap;z-index:3}
.gdistrict{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12px;font-weight:600;color:#1d2430}
.gdistrict .sum{font-weight:400;font-size:11px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px}.dot.truck{background:var(--brand)}.dot.mover{background:var(--brand2)}.dot.repair{background:#8a5fd0}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden;height:20px}
.step button{border:none;border-radius:0;padding:0 6px;height:20px;line-height:1;background:#f6f8fb;color:#3a4553;font-size:12px}
.step span{padding:0 7px;font-size:11px;font-variant-numeric:tabular-nums}
header .step button{background:#2b3545;color:#dfe6ef}header .step span{color:#fff}
.verdict{padding:6px 10px;border-top:1px solid var(--line);font-size:12px;background:#f8fafc;border-radius:0 0 var(--radius) var(--radius)}
.verdict b.ok{color:var(--ok)}.verdict b.bad{color:var(--bad)}
main{flex:1;display:grid;grid-template-columns:292px minmax(280px,1fr) 396px;gap:9px;padding:0 12px 9px;min-height:0}
.col{display:flex;flex-direction:column;min-height:0;gap:7px}
.alerts{background:#fff6ea;border:1px solid #f3dcb4;border-radius:10px;padding:5px 8px;font-size:12px;flex:none;max-height:104px;overflow:auto}
.alerts .a{display:flex;gap:6px;align-items:flex-start;padding:2px 0;border-top:1px dashed #f0dfc4}.alerts .a:first-of-type{border-top:none}
.tabs{overflow-x:auto;flex-wrap:nowrap}
.tabs button{font-size:11.5px;padding:5px 5px;white-space:nowrap;flex:none}
.chips{display:flex;gap:4px;flex:none}.chips button{font-size:11px;padding:3px 8px;border-radius:999px}.chips button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.list{overflow:auto;flex:1;min-height:110px;padding-right:2px}
.ghdr{font-size:11px;color:var(--muted);margin:8px 0 4px;display:flex;align-items:center;gap:6px}.ghdr:first-child{margin-top:0}
.task{border:1px solid var(--line);border-left:4px solid var(--info);border-radius:9px;background:#fff;padding:6px 9px;margin-bottom:6px;cursor:pointer}
.task:hover{border-color:#b9c3d0}.task.sel{box-shadow:0 0 0 2px #cfe0f7;border-color:#9dc0e8}
.task.planned{border-left-color:var(--brand)}.task.dispatched,.task.en_route{border-left-color:var(--sim)}.task.done{border-left-color:#aab6c4;opacity:.75}
.task.too_late,.task.latecar{border-left-color:var(--bad)}.task.needs_cross_district,.task.minor_gap{border-left-color:var(--grey)}
.task.gap_summary{border-left-color:var(--brand2);background:#f4fbf8}.task.mover{border-left-color:var(--brand2)}.task.repair{border-left-color:#8a5fd0}
.task.empty{border-left-color:var(--warn)}.task.iso{border-left-color:var(--bad);background:#fff8f8}.task.superseded,.task.cancelled{opacity:.45}
.task .hd{display:flex;justify-content:space-between;align-items:baseline;gap:6px}.task .hd b{font-size:13px}
.task .cd{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--brand)}.task .cd.urgent{color:var(--bad)}.task .cd.soon{color:var(--warn)}
.task .sub{font-size:11.5px;color:#3a4553;margin-top:3px}.task .rs{font-size:10.5px;color:var(--muted);margin-top:2px}
.bar{height:5px;border-radius:3px;background:#eef1f5;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand2)}
.logrow{display:flex;gap:7px;font-size:11.5px;padding:4px 2px;border-bottom:1px solid var(--line);line-height:1.5}
.logrow .t{color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.logrow.issue{color:#a12626}.logrow.diff{color:#8a5400}.logrow.mover{color:#0b7a5c}
#map{height:100%;min-height:200px;border-radius:var(--radius)}
.pin{width:22px;height:22px;border-radius:50%;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.pin.truck{background:#7a5af5;font-size:13px}.pin.mover{background:#0aa47a;font-size:13px}
.detail{overflow:auto;padding:10px}
.big{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.big div{background:#f6f8fb;border-radius:8px;padding:6px 8px;text-align:center}.big .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}.big .l{font-size:10px;color:var(--muted)}
.chain{display:flex;gap:5px;align-items:center;margin-top:8px;flex-wrap:wrap;font-size:10.5px;color:var(--muted)}
.chain span{background:#f2f5f9;border-radius:6px;padding:3px 6px;color:#3a4553}
.chain span.pend{background:#fff4e5;color:#8a5400}
.chain b{font-variant-numeric:tabular-nums}
.chain i{font-style:normal;color:var(--muted);margin-left:3px}
.chain span.xs{background:none;padding:0}
.eff{display:flex;gap:6px;margin-top:6px;font-size:11px;color:#3a4553;flex-wrap:wrap}.eff span{background:#eef2f7;border-radius:6px;padding:3px 6px}
.stop{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line);font-size:11.5px}
.stop .no{width:21px;height:21px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none;font-weight:600}
.stop.pickup .no{background:var(--warn)}.stop.ok{background:#f6fcf8}.stop.lateStop{background:#fff6f6}
.stop .why{font-size:10.5px;color:var(--muted)}
.rep{display:flex;gap:5px;align-items:center;margin-top:5px;flex-wrap:wrap}
.rep select{font:inherit;font-size:11px;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:#fff}
.brief{font-size:11.5px;background:#f6f8fb;border-radius:8px;padding:7px 8px;color:#2b3542}
details.rule{margin-top:8px;font-size:11px;color:#3a4553;background:#fbfcfe;border:1px solid var(--line);border-radius:8px;padding:6px 8px}
details.rule summary{cursor:pointer;color:var(--brand);font-size:11.5px}
.modal{position:fixed;inset:0;background:rgba(18,24,34,.45);z-index:900;display:none;align-items:center;justify-content:center}
.modal.on{display:flex}.modal .card{width:640px;max-width:calc(100vw - 40px);max-height:78vh;overflow:auto}
@media(max-height:900px){
  .alerts{max-height:58px}
  .gantt{max-height:150px}
  .cell{width:52px}.cell .rt{font-size:13px}
  .kpi{padding:4px 7px}.kpi .v{font-size:16px}.kpi .s{font-size:9px;line-height:1.25}
  .citywrap{padding:4px 10px}.citysum{font-size:11px;line-height:1.45}
}
@media(max-height:790px){
  .alerts{max-height:44px}.gantt{max-height:124px}
  .kpi .s{display:none}.list{min-height:84px}
  .cell{width:48px}.cell .bar{display:none}
  .ptitle{padding:3px 10px}.ptitle .lg{display:none}
}
@media(max-width:1180px){
  header{gap:6px;padding:5px 9px}header h1{font-size:13px}header .scen,header .badge{display:none}
  .citysum{width:240px}.kpis{grid-template-columns:repeat(8,1fr);gap:5px;padding:0 9px 5px}
  .kpi{padding:4px 6px}.kpi .v{font-size:16px}.kpi .l{font-size:9.5px}.kpi .s{font-size:9px}
  .panel{margin:0 9px 6px}.gantt{max-height:214px}
  main{grid-template-columns:250px minmax(220px,1fr) 340px;gap:7px;padding:0 9px 7px}
  .glabel{width:120px}.glabel .vn{display:none}.detail{padding:8px}
  .ptitle .lg span:nth-child(n+4){display:none}
}
</style></head><body>
<header>
  <h1>🚚 微笑單車調度中心</h1><span class="badge sim">派車執行為模擬</span>
  <span class="clock" id="clock">–</span><span class="scen" id="scen"></span>
  <span style="flex:1"></span>
  <span class="seg row" style="gap:3px"><button class="small on" id="pk-am" onclick="setPeak('am');document.getElementById('pk-am').classList.add('on');document.getElementById('pk-pm').classList.remove('on')">早尖峰</button><button class="small" id="pk-pm" onclick="setPeak('pm');document.getElementById('pk-pm').classList.add('on');document.getElementById('pk-am').classList.remove('on')">晚尖峰</button></span>
  <span class="small" style="color:#9fd3ff">在勤</span><span id="fleetTotal" class="small" style="color:#fff">–</span>
  <button class="small" onclick="resetAlloc()">⚡ 依資料配置</button>
  <button class="small" onclick="openCycle()">資源帳</button>
  <button class="small" onclick="openInfo('fleet')">編制來源</button>
  <button class="small" onclick="openInfo('rules')">排程依據</button>
  <button class="small" onclick="openInfo('assump')">情境假設</button>
</header>

<section class="panel">
  <div class="ptitle">🗺 全市盤面（29 區）　<span class="badge real" id="cityBadge">見車率與缺口由歷史快照算出</span><span class="badge grey">配車＝全市 40 車依缺口權重換算</span>
    <span class="lg"><span><i style="background:#2fa66a"></i>≥93%</span><span><i style="background:#e6c229"></i>90–93%</span><span><i style="background:#e08a00"></i>88–90%</span><span><i style="background:#d64545"></i>&lt;88%</span><span>外框＝本系統納管</span></span>
  </div>
  <div class="citywrap"><div class="cells" id="cityCells"></div><div class="citysum" id="citySum"></div></div>
</section>

<div class="kpis" id="kpis"></div>

<section class="panel">
  <div class="ptitle">🗓 車隊排班與現場動態　<span class="badge real">缺口・路線・最遲出發為真實計算</span><span class="badge sim">編制、位置、回報為情境推導</span>
    <span class="lg"><span><i style="background:var(--brand)"></i>車組</span><span><i style="background:var(--brand2)"></i>人力</span><span><i style="background:#8a5fd0"></i>維修</span><span><i style="background:var(--bad)"></i>延誤</span></span>
  </div>
  <div class="gantt" id="gantt"></div>
  <div class="verdict" id="verdict"></div>
</section>

<main>
  <div class="col">
    <div class="alerts" id="sudden"></div>
    <div class="tabs" id="tabs" style="flex:none"></div>
    <div class="chips" id="chips"></div>
    <div class="list" id="tasks"></div>
  </div>
  <div style="min-height:0"><div id="map"></div></div>
  <aside class="card detail" id="detail"><div class="muted small">點左側任務或時間軸上的任一條，看派工單、站點順序與現場回報。</div></aside>
</main>

<div class="modal" id="modal" onclick="if(event.target===this)this.classList.remove('on')"><div class="card" id="modalBody"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/static/common.js"></script>
<script src="/static/ops.js"></script>
</body></html>
