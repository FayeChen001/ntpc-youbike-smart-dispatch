<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>新北交通局｜YouBike 預警調度儀表板</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"><link rel="stylesheet" href="/static/common.css">
<style>
body{height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:6px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}header h1{font-size:15px;margin:0}header .clock{font-weight:600;color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;padding:8px 14px}
main{flex:1;display:grid;grid-template-columns:minmax(360px,1fr) minmax(320px,400px);gap:10px;padding:0 14px 10px;min-height:0;position:relative}
#map{height:100%;min-height:300px}.side{display:flex;flex-direction:column;min-height:0;gap:8px}.side .card{display:flex;flex-direction:column;min-height:0;flex:1;padding:10px}.list{overflow:auto;flex:1}
.alert{border:1px solid var(--line);border-left:4px solid var(--info);border-radius:8px;padding:7px 9px;margin-bottom:6px;background:#fff}.alert.high{border-left-color:var(--bad)}.alert.warn{border-left-color:var(--warn)}.alert.info{border-left-color:var(--grey)}.alert.acked{opacity:.75}.alert .m{font-size:12px}.alert .meta{font-size:11px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between;align-items:center}
.ctl{display:flex;gap:6px;align-items:center;font-size:12px}.ctl select{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px}
.brief{font-size:12px;background:#f6f8fb;border-radius:8px;padding:8px;color:#2b3542;min-height:40px}
.compare{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}.compare div{background:#f6f8fb;border-radius:8px;padding:6px}.compare .v{font-size:18px;font-weight:700}.compare .l{font-size:10px;color:var(--muted)}
.mini{font-size:11px;color:var(--muted)}
.ledsum{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.alert select.owner{font:inherit;font-size:11px;padding:2px 4px;border:1px solid var(--line);border-radius:6px;max-width:96px}
.tl{border-left:2px solid var(--line);padding:3px 0 3px 8px;margin-left:3px}
.tl .pill{font-size:10px}
.dcard{border:1px solid #d6c9f5;background:#faf8ff;border-radius:10px;padding:9px 10px;margin-top:10px}
.dcard h4{margin:0 0 6px;font-size:12px;display:flex;align-items:center;gap:6px}
.opt{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;margin-bottom:6px}
.opt.sel{border-color:var(--brand);box-shadow:0 0 0 2px #cfe0f7}
.opt .ol{font-size:12px;font-weight:600}
.opt .od{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.6}
.opt.na{background:#f6f8fb;border-style:dashed}
.dec{background:#eef7f1;border:1px solid #bfe6cf;border-radius:8px;padding:7px 9px;font-size:11px;line-height:1.7;margin-top:6px}
/* 驗收指標面板 */
.mx{position:fixed;inset:0;background:var(--bg);z-index:1200;display:none;flex-direction:column}
.mx.open{display:flex}
.mxhead{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap;font-size:12px}
.mxhead select,.mxhead input{font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px}
.mxhead input{width:56px}
.mxbody{flex:1;overflow:auto;padding:12px 14px 40px}
.mxsec{margin-bottom:14px}
.mxsec>h3{font-size:13px;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mxgrid{display:grid;gap:10px}
.mxnote{font-size:11px;color:var(--muted);line-height:1.75;background:#f6f8fb;border-radius:8px;padding:8px 10px}
.mxnote b{color:#2b3542}
.bars{display:flex;align-items:flex-end;gap:3px;height:104px;padding-top:4px}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bars .b .stack{width:100%;display:flex;align-items:flex-end;justify-content:center;gap:1px;height:100%}
.bars .b i{display:block;width:46%;background:var(--brand);border-radius:2px 2px 0 0;min-height:1px}
.bars .b i.up{background:#cfe0f7}
.bars .b em{font-style:normal;font-size:9px;color:var(--muted);margin-top:3px;white-space:nowrap}
.mxlegend{font-size:11px;color:var(--muted);display:flex;gap:12px;align-items:center}
.mxlegend s{text-decoration:none;display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:middle}
.trow{cursor:pointer}.trow:hover{background:#f6f8fb}
.mxcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
tr.cur td{background:#eaf2fd;font-weight:600}
.mxrange{font-size:11px;color:var(--muted)}
/* 三分欄證據 */
.ev3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.ev3 .c{background:#f6f8fb;border-radius:8px;padding:6px 8px;min-width:0}
.ev3 .c h5{margin:0 0 3px;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.ev3 .c.ai{background:#f3efff}.ev3 .c.field{background:#eef7f1}
.ev3 .c .na{color:var(--muted);font-size:11px}
/* 手機通知情境 */
.phone{position:fixed;inset:0;background:rgba(18,24,34,.55);z-index:1400;display:none;align-items:center;justify-content:center}
.phone.open{display:flex}
.phone .fr{width:330px;max-width:92vw;background:linear-gradient(170deg,#243447,#111a26);border-radius:36px;padding:18px 12px 14px;box-shadow:0 24px 60px rgba(0,0,0,.45);color:#fff}
.phone .simbar{background:var(--sim);color:#fff;font-size:10px;text-align:center;border-radius:999px;padding:3px 8px;margin-bottom:10px}
.phone .time{text-align:center;font-size:34px;font-weight:300;letter-spacing:.02em}
.phone .date{text-align:center;font-size:11px;opacity:.7;margin-bottom:14px}
.phone .nc{background:rgba(255,255,255,.94);color:var(--ink);border-radius:16px;padding:9px 11px;margin-bottom:8px;cursor:pointer;transition:.12s}
.phone .nc:hover{transform:scale(1.02)}
.phone .nc .ap{font-size:10px;color:var(--muted);display:flex;justify-content:space-between}
.phone .nc .ti{font-weight:600;font-size:13px;margin-top:2px}
.phone .nc .bo{font-size:11px;color:#3a4553;margin-top:2px;line-height:1.5}
.phone .foot{font-size:10px;opacity:.75;line-height:1.7;margin-top:10px}
.phone .none{background:rgba(255,255,255,.12);border-radius:12px;padding:10px;font-size:11px;text-align:center}
</style></head><body>
<header><h1>新北市交通局｜YouBike 預警與調度儀表板</h1><span class="badge grey">政府端</span><span class="clock" id="clock">–</span><span class="mini" id="src"></span>
  <span style="flex:1"></span>
  <div class="ctl">圖層 <select id="layer"><option value="empty">缺車風險（零車機率）</option><option value="full">缺位風險（零位機率）</option></select> 尺度 <select id="horizon"><option value="60">60 分</option><option value="120" selected>120 分</option><option value="180">180 分</option></select> 行政區 <select id="district"><option value="">全市</option></select> <label><input type="checkbox" id="adj" checked> 含民眾意向修正</label> <button class="small" onclick="toggleLive()" id="livebtn">看即時現況</button> <button class="small" onclick="ovOpen()">全域儀表板</button> <button class="small" onclick="phoneOpen()">通知情境</button> <button class="small primary" onclick="mxOpen()">驗收指標</button></div>
</header>
<div class="kpis" id="kpis"></div>
<main>
  <div style="position:relative;min-height:0"><div id="map"></div>
    <div class="drawer" id="drawer"></div></div>
  <div class="side">
    <div class="card" style="flex:0 0 auto"><div class="row between"><b>主管簡報</b><span id="brief-src"></span></div><div class="brief" id="brief">–</div></div>
    <div class="card"><div class="tabs" style="margin-bottom:6px"><button class="on" onclick="sideTab('alerts',this)">事件台帳 <span class="pill" id="n-alerts">0</span></button><button onclick="sideTab('check',this)">待查清單</button><button onclick="sideTab('tasks',this)">排程</button><button onclick="sideTab('model',this)">模型卡</button><button onclick="sideTab('lake',this)">資料湖</button></div>
      <div class="list" id="side-alerts"></div><div class="list" id="side-check" style="display:none"></div><div class="list" id="side-tasks" style="display:none"></div><div class="list" id="side-model" style="display:none"></div><div class="list" id="side-lake" style="display:none"></div></div>
  </div>
</main>
<div class="mx" id="mx">
  <div class="mxhead">
    <b style="font-size:14px">驗收指標</b><span class="badge grey">政府端</span>
    <span class="mini" id="mx-now"></span>
    <span style="flex:1"></span>
    期間 <select id="mx-window"></select>
    類型 <select id="mx-kind"><option value="empty">缺車（無車可借）</option><option value="full">缺位（無位可還）</option></select>
    預測尺度 <select id="mx-horizon"><option value="60">60 分</option><option value="120" selected>120 分</option><option value="180">180 分</option></select>
    值班可處理 <input id="mx-duty" type="number" value="20" min="1" max="500" step="1"> 候選/小時
    <button class="small" onclick="mxClose()">✕ 關閉</button>
  </div>
  <div class="mxbody" id="mx-body"><div class="muted small">載入中…</div></div>
</div>
<div class="mx" id="ov">
  <div class="mxhead"><b style="font-size:14px">全域儀表板</b><span class="badge grey">政府端</span><span class="mini" id="ov-clock"></span>
    <span style="flex:1"></span><button class="small" onclick="ovClose()">✕ 關閉</button></div>
  <div class="mxbody" id="ov-body"><div class="muted small">載入中…</div></div>
</div>
<div class="phone" id="phone" onclick="if(event.target===this)phoneClose()">
  <div class="fr">
    <div class="simbar">模擬情境畫面：這是應用內的示意，不是真的 iOS 鎖定畫面，也沒有背景推播</div>
    <div class="time" id="ph-time">–</div><div class="date" id="ph-date"></div>
    <div id="ph-list"></div>
    <div class="foot" id="ph-foot"></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script><script src="/static/common.js"></script>
<script>
const map = makeMap('map',[25.02,121.45],12); let markers = L.layerGroup().addTo(map); let S={stations:[], alerts:[], live:false, liveData:null, kpi:null, selected:null, tasks:[]};
legendControl(map, `<b>風險色階</b><br><i style="background:#2fa66a"></i>&lt;20%　<i style="background:#e6c229"></i>20–35%<br><i style="background:#e08a00"></i>35–60%　<i style="background:#d64545"></i>≥60%<br><i style="background:#9aa4b2;border:1px dashed #555"></i>待查（雙零/長期不變/資料）<br><span class="xs muted">圓大小＝車柱數</span>`);
const $ = id=>document.getElementById(id);
async function loadStations(){ if(S.live){ return drawLive(); } const d = await API.get('/api/stations?adjusted='+($('adj').checked?1:0)); S.stations = d.stations; $('src').innerHTML = srcBadge(d.source)+' 資料時間 '+d.ts; draw(); if(!$('district').options.length>1){ const ds=[...new Set(S.stations.map(s=>s.district))].sort(); ds.forEach(x=>$('district').append(el('option',{value:x},x))); } }
function draw(){ markers.clearLayers(); const h=+$('horizon').value, layer=$('layer').value, dist=$('district').value; S.stations.filter(s=>!dist||s.district===dist).forEach(s=>{ const m = stationMarker(s,{horizon:h,layer}); m.on('click',()=>openStation(s.sid)); markers.addLayer(m); }); if(dist){ const pts=S.stations.filter(s=>s.district===dist); if(pts.length) map.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lon])).pad(0.1)); } }
async function toggleLive(){ S.live=!S.live; $('livebtn').textContent = S.live?'回到回放預測':'看即時現況'; if(S.live){ $('src').innerHTML='<span class="badge real">新北開放平台即時資料</span> 讀取中…'; try{ S.liveData = await API.get('/api/live'); drawLive(); }catch(e){ $('src').textContent='即時 API 暫時失敗'; } } else loadStations(); }
function drawLive(){ const d=S.liveData; if(!d) return; markers.clearLayers(); $('src').innerHTML=`<span class="badge real">即時</span> ${d.fetched_at}・${d.count} 站・空 ${d.empty}／滿 ${d.full}／停用 ${d.inactive}・與歷史站鍵對得上 ${d.matched} 站`; d.stations.forEach(s=>{ const color = s.act!=='1'?'#9aa4b2': s.sbi===0?'#d64545': s.bemp===0?'#e08a00':'#2fa66a'; markers.addLayer(L.circleMarker([s.lat,s.lon],{radius:6,color:'#fff',weight:1,fillColor:color,fillOpacity:.9}).bindTooltip(`<b>${s.name}</b><br>可借 ${s.sbi}（一般 ${s.yb2}・電輔 ${s.eyb}）／可還 ${s.bemp}／柱 ${s.tot}<br>更新 ${s.mday}${s.act!=='1'?'<br><b>停用</b>':''}`)); }); }
function kpis(k){ S.kpi=k; $('clock').textContent = '回放時間 '+k.ts; const t=(v,l,s,c)=>`<div class="kpi"><div class="v" style="color:${c||'inherit'}">${v}</div><div class="l">${l}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
  $('kpis').innerHTML = t(k.empty_now,'現在無車站','快照狀態，非失敗旅次',k.empty_now>40?'var(--bad)':'') + t(k.full_now,'現在無位站','', k.full_now>15?'var(--warn)':'') + t(k.both_zero+k.stale,'待查站','雙零／長期不變，不派車','var(--grey)') + t(k.risk_empty_120,'120 分內高風險缺車',`60 分 ${k.risk_empty_60}・180 分 ${k.risk_empty_180}`,'var(--warn)') + t(k.risk_full_120,'120 分內高風險缺位',`60 分 ${k.risk_full_60}・180 分 ${k.risk_full_180}`,'var(--warn)') + t(k.open_alerts,'開啟告警',`高 ${k.high_alerts}・平均確認 ${k.mean_ack_min??'–'} 分`,k.high_alerts?'var(--bad)':'') + t(k.tasks_planned,'排程中任務','重點三區・提前 120/180 分') + t(k.intents_active,'民眾意向',`預期分流 ${k.expected_diverted} 車次（×0.7）`,'var(--brand2)'); }
/* 事件台帳：分級、觀測時長、負責人、ETA、原因與證據 */
const LVCLS = {P0:'high', P1:'warn', P2:'info', C:'grey', W:'grey'};
function lv(a){ const L=(S.ledger&&S.ledger.levels)||{}; const k=a.level||'P2'; return `<span class="badge ${LVCLS[k]||'grey'}" title="${(L[k]||{}).desc||''}">${(L[k]||{}).label||k}</span>`; }
function dur(o){ if(!o) return ''; const u = o.upper_min==null?'<b>未知</b>':(o.upper_min>=1440?'超過 24 小時':o.upper_min+' 分'); return `零值快照跨度 <b>${o.span_min} 分</b>（可能上界 ${u}）${o.gap_inside?'<span class="badge grey">含缺測</span>':''}`; }
async function loadAlerts(){
  const d = await API.get('/api/ledger'); S.ledger=d; S.alerts=d.events;
  $('n-alerts').textContent = (d.counts.P0||0)+(d.counts.P1||0);
  renderAlerts(); renderCheck();
}
function renderAlerts(){
  const d=S.ledger; if(!d) return; const dist=$('district').value;
  const items = d.events.filter(a=>a.level!=='W').filter(a=>!dist||a.district===dist);
  const sum = `<div class="ledsum">
    <span class="badge high">P0 ${d.counts.P0||0}</span><span class="badge warn">P1 ${d.counts.P1||0}</span><span class="badge info">P2 ${d.counts.P2||0}</span><span class="badge grey">長期 ${d.counts.C||0}</span>
    <span class="xs muted">未指派 ${d.unowned_p01}・無恢復計畫 ${d.no_plan_p01}</span></div>
    <div class="xs muted" style="margin-bottom:6px">${d.coverage_note}目前排程涵蓋 ${d.planned_districts.join('、')||'無'}。分級為試行門檻，非官方標準。</div>`;
  $('side-alerts').innerHTML = sum + (items.map(a=>{
    const o=a.observed, c=a.cause||{}, al=a.alt;
    return `<div class="alert ${LVCLS[a.level]==='high'?'high':LVCLS[a.level]==='warn'?'warn':'info'} ${a.status==='acked'?'acked':''}">
      <div class="m">${lv(a)} <b>${a.station}</b> <span class="xs muted">${a.district}</span>${a.cluster?' <span class="badge high">站群</span>':''}</div>
      <div class="xs" style="margin-top:3px">${o?dur(o):a.message}</div>
      <div class="xs muted" style="margin-top:2px">原因：${c.label||'—'}${c.confident===false?'（證據不足）':''}${al?`・500 m 內可借替代站 ${al.n}${al.no_neighbor?'（無鄰站）':''}`:''}</div>
      <div class="xs muted">負責人：${a.owner||'<b style="color:var(--bad)">未指派</b>'}・ETA：${a.eta?a.eta.slice(11,16)+`<span class="xs">（${a.eta_source||''}）</span>`:'—'}</div>
      <div class="meta"><span>${a.opened.slice(11)} 開啟${a.acked?`・${a.acked.slice(11)} 確認`:''}</span><span>
        ${a.status==='open'?`<button class="small" onclick="act('${a.id}','ack')">確認</button>`:''}
        <select class="small owner" onchange="assign('${a.id}',this.value)"><option value="">指派…</option>${(d.owners||[]).map(o2=>`<option ${a.owner===o2?'selected':''}>${o2}</option>`).join('')}</select>
        <button class="small" onclick="act('${a.id}','dispatch')">轉調度</button><button class="small ghost" onclick="openEvent('${a.id}')">詳情</button></span></div></div>`;
  }).join('') || '<div class="muted small">目前沒有開啟中的事件</div>');
}
function renderCheck(){
  const d=S.ledger; if(!d) return; const items = d.events.filter(a=>a.level==='W');
  $('side-check').innerHTML = `<div class="xs muted" style="margin-bottom:6px">這些站不會自動轉成派車任務；需查核營運狀態、資料更新或容量版本。</div>`
    + (items.map(a=>`<div class="alert info"><div class="m">${a.message}</div><div class="meta"><span>${a.opened.slice(11)}</span><span><button class="small" onclick="act('${a.id}','resolve')">已查核</button><button class="small ghost" onclick="openStation(${a.sid})">看站</button></span></div></div>`).join('') || '<div class="muted small">無</div>');
}
async function act(id, a){ await API.post(`/api/alerts/${id}/${a}`); loadAlerts(); }
async function assign(id, owner){ if(!owner) return; await API.post(`/api/ledger/${id}/assign`, {owner}); loadAlerts(); }
async function addNote(id){ const t = prompt('補充處理紀錄（會寫進事件時間線）'); if(!t) return; await API.post(`/api/ledger/${id}/note`, {note:t}); openEvent(id); loadAlerts(); }
const TLLABEL = {opened:'開啟', level:'分級異動', cluster:'站群', assign:'指派', note:'處理紀錄', ack:'確認'};
async function openEvent(id){
  const a = await API.get('/api/ledger/'+id); const dr=$('drawer'); dr.classList.add('open');
  const o=a.observed, c=a.cause||{}, al=a.alt, th=(S.ledger||{}).thresholds||{};
  dr.innerHTML = `<div class="row between"><b style="font-size:15px">${lv(a)} ${a.station}</b><button class="small ghost" onclick="$('drawer').classList.remove('open')">✕</button></div>
  <div class="small muted">${a.district}・${a.type}・${a.opened} 開啟${a.cluster?`・<span class="badge high">站群同時失效（${a.cluster_n} 站）</span>`:''}</div>
  ${o?`<div class="compare" style="margin:10px 0"><div><div class="v">${o.span_min}</div><div class="l">觀測跨度（分）</div></div><div><div class="v">${o.upper_min==null?'未知':(o.upper_min>=1440?'>24h':o.upper_min)}</div><div class="l">可能上界（分）</div></div><div><div class="v">${o.snapshots}</div><div class="l">零值快照數</div></div><div><div class="v">${al?al.n:'–'}</div><div class="l">500 m 可借替代站</div></div></div>
  <div class="xs muted">從 ${o.started_obs.slice(5,16)} 起被觀測到的快照都是零，首末相差 ${o.span_min} 分鐘。<b>這是觀測跨度，不是確定的連續中斷時間</b>——30 分鐘一筆的快照證明不了中間有沒有短暫恢復。最後一筆有效觀測 ${o.last_data_ts?o.last_data_ts.slice(5,16):'無'}${o.gap_inside?'・區間內有缺測，期間狀態不明':''}${o.upper_min==null?'・前面找不到確認正常的觀測，上界未知':''}。</div>`:`<div class="xs muted" style="margin:10px 0">${a.message}</div>`}
  <div style="margin-top:10px"><b class="small">原因與證據</b>

let DSEL = {};   // event_id -> option_id
function dcard(a){
  const o=a.decision_options, cur=(a.decisions||[]).filter(d=>!d.superseded).slice(-1)[0];

  const sel = DSEL[a.id] || (o.options[0]||{}).id || '';
  return `<div class="dcard"><h4>主管決策卡 <span class="badge sim">決策留痕</span>
      <span class="xs muted">事件版本 v${a.version}</span></h4>
    <table>
      <tr><td>站名</td><td><b>${a.station}</b> <span class="xs muted">${a.district}</span></td></tr>
      <tr><td>觀測到多久</td><td class="mono">零值快照跨度 ${obs.span_min??'—'} 分（可能上界 ${obs.upper_min==null?'未知':obs.upper_min+' 分'}）</td></tr>
      <tr><td>最後資料時間</td><td class="mono">${obs.last_data_ts?obs.last_data_ts.slice(5,16):'未提供'}</td></tr>
      <tr><td>服務影響</td><td>500 m 內可用替代站 <b>${al.n??'—'}</b>${a.cluster?`・站群 ${a.cluster_n} 站同時無法服務`:''}${av?`・官方可借 ${av.official_bikes??'未提供'}／已確認不可用 ${av.known_unusable_bikes}`:''}
        <div class="xs muted">替代站是候選資源存在，不等於使用者走得到。</div></td></tr>
      <tr><td>原因</td><td>${c.confident?`<b>${c.label}</b>（有證據）`:`<b>待查假說：${c.label}</b> <span class="badge grey">證據不足</span>`}
        <div class="xs muted">${(c.evidence||[]).map(e=>e.text).join('；')}</div></td></tr>
      <tr><td>目前負責人</td><td>${a.owner||'<b style="color:var(--bad)">未指派</b>'}</td></tr>
      <tr><td>現行 ETA</td><td>${a.eta?a.eta.slice(11,16)+` <span class="xs muted">${a.eta_source||''}</span>`:'尚無恢復計畫'}</td></tr>
    </table>
    ${cur?`<div class="dec"><b>已有決策</b>：${cur.option_label}（${cur.option_source}）<br>
      理由：${cur.rationale}<br>
      <span class="xs muted">${cur.ts} 由 ${cur.actor} 決定・事件版本 v${cur.event_version_at_decision}${cur.task_id?`・任務 ${cur.task_id} ${cur.task_version==null?'（營運端未提供版本）':'v'+cur.task_version}`:''}</span></div>`:''}
    <div style="margin-top:8px"><b class="small">方案（由營運端提供）</b>
      ${o.options.map(x=>`<div class="opt ${x.id===sel?'sel':''}" onclick="DSEL['${a.id}']='${x.id}';openEvent('${a.id}')">
        <div class="ol">${x.label} <span class="xs muted">${x.source}</span></div>
        <div class="od">抵達時間：${x.eta?x.eta.slice(11,16):`<b>未提供</b>${x.eta_missing_reason?`（${x.eta_missing_reason}）`:''}`}
          ${x.task_id?`・任務 ${x.task_id} ${x.task_version==null?'（版本未提供）':'v'+x.task_version}（${x.task_status}）`:''}${x.cycle?`・cycle ${x.cycle}`:''}
          ${x.on_time===false?'・<b style="color:var(--warn)">這張任務有站點來不及</b>':''}
          <br>代價／說明：${x.cost||'營運端未說明'}
          ${x.affected&&x.affected.length?`<br>同趟受影響站點：${x.affected.join('、')}`:''}</div></div>`).join('')}
      ${o.unavailable.map(x=>`<div class="opt na"><div class="ol">${x.label} <span class="badge grey">未提供</span></div>
        <div class="od">需要${x.need}</div></div>`).join('')}
    </div>
    <div class="xs muted" style="margin-top:6px">${o.source_rule}${o.contract_gap?`<br><b>契約缺口</b>：${o.contract_gap}`:''}</div>
    ${o.options.length?`<div style="margin-top:8px">
      <input id="drat" placeholder="決策理由（必填，會連同版本與時間留存）" style="width:100%;padding:5px 7px;border:1px solid var(--line);border-radius:6px;font:inherit;font-size:12px">
      <div class="row" style="margin-top:6px">
        <button class="small primary" onclick="decide('${a.id}',${a.version},false)">送出決策</button>
        ${cur?`<button class="small" onclick="decide('${a.id}',${a.version},true)">取代現有決策</button>`:''}
        <span class="xs muted">送出前會以事件版本 v${a.version} 檢查，版本過期會擋下來要你重讀。</span></div></div>`
      :'<div class="xs muted" style="margin-top:8px">營運端還沒有任何方案，這張卡目前只能做追蹤與協調，不能決策。</div>'}
  </div>`;
}
async function decide(id, version, supersede){
  const o = (S.ledger.events.find(x=>x.id===id)||{}).decision_options;
  const optId = DSEL[id] || ((o&&o.options[0])||{}).id;
  const opt = (o.options||[]).find(x=>x.id===optId);
  const rat = ($('drat')||{}).value||'';
  if(!opt) return alert('沒有可選的方案');
  if(!rat.trim()) return alert('請填決策理由');
  const r = await fetch(`/api/ledger/${id}/action`,{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({action:'decide', option:opt, note:rat, version, supersede, request_id:'D-'+id+'-'+Date.now()})});
  const d = await r.json();
  if(r.status===409){ alert((d.message||'版本或決策衝突')+'\n\n畫面會重新載入最新狀態。'); }
  await loadAlerts(); openEvent(id);
}

      <table>${Object.entries(tb.by_status).map(([k,v])=>`<tr><td>${k}</td><td class="mono">${v}</td></tr>`).join('')}</table>
      <div class="xs muted" style="margin-top:6px">排程涵蓋 ${tb.planned_districts.join('、')||'無'}。${tb.owner}</div></div>
      <div class="card"><b class="small">逐站期限與資源帳</b>
      <div class="kpis" style="padding:0;grid-template-columns:1fr 1fr">
        ${kpi(tb.stop_deadlines.on_time,'準時送達站','B 主線逐站判定')}
        ${kpi(tb.stop_deadlines.late,'來不及的站','', tb.stop_deadlines.late?'var(--warn)':'')}
      </div>
      <div class="xs muted" style="margin-top:6px">${tb.stop_deadlines.note}<br>${tb.coverage_rule}</div>
      ${Object.keys(tb.by_reservation).length?`<div class="xs muted" style="margin-top:6px">資源帳狀態：${Object.entries(tb.by_reservation).map(([k,v])=>`${k} ${v}`).join('・')}${tb.cycles.length?`・cycle ${tb.cycles.join('、')}`:''}</div>`:''}</div>
      <div class="card"><b class="small">未覆蓋缺口（${tb.uncovered_count}）</b>
      <table><tr><th>行政區</th><th>尺度</th><th>缺口</th><th>狀態</th></tr>
      ${tb.uncovered.map(g=>`<tr><td>${g.district||'—'}</td><td class="mono">${g.horizon||'—'}</td><td class="mono">${g.deficit??'未提供'}</td><td class="xs">${g.status}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">無</td></tr>'}</table></div></div>
    <div class="mxnote" style="margin-top:8px"><b>契約狀態</b>：${tb.contract_note}</div></div>`;

  h += `<div class="mxsec"><h3>五、責任與處理進度</h3><div class="card">
    <div class="kpis" style="padding:0">
      ${kpi(d.counts.P0||0,'P0','','var(--bad)')}${kpi(d.counts.P1||0,'P1','','var(--warn)')}
      ${kpi(d.unowned_p01,'P0/P1 未指派負責人','', d.unowned_p01?'var(--bad)':'')}
      ${kpi(d.acked_not_assigned,'已確認但未指派','ack 不等於指派')}
      ${kpi(d.no_plan_p01,'P0/P1 沒有恢復計畫','')}
    </div>
    <div class="xs muted" style="margin-top:6px">${d.ack_note}<br>${d.coverage_note}</div></div></div>`;
  $('ov-body').innerHTML = h;
}

/* ---------------------------------------------- 通知情境預覽（明示模擬） */
function phoneOpen(){ $('phone').classList.add('open'); phoneRender(); }
function phoneClose(){ $('phone').classList.remove('open'); }
function phoneRender(){
  const d=S.ledger; if(!d) return;
  const ts = (d.overview&&d.overview.data_ts)||'';
  $('ph-time').textContent = ts.slice(11,16)||'--:--';
  $('ph-date').textContent = ts.slice(0,10)+'（回放時間）';
  const items = d.events.filter(a=>a.level==='P0').slice(0,3);
  $('ph-list').innerHTML = items.length? items.map(a=>`<div class="nc" onclick="phoneGo('${a.id}')">
      <div class="ap"><span>新北交通局 · YouBike 預警</span><span>${(a.opened||'').slice(11,16)}</span></div>
      <div class="ti">${{P0:'P0',P1:'P1'}[a.level]||a.level}｜${a.station}</div>
      <div class="bo">${a.observed?`零值快照跨度 ${a.observed.span_min} 分`:a.message}${a.cluster?`・站群 ${a.cluster_n} 站同時無法服務`:''}${a.owner?`・負責人 ${a.owner}`:'・尚未指派負責人'}</div>
    </div>`).join('') : '<div class="none">目前沒有 P0 事件。這個畫面只在有 P0 時會有通知卡。</div>';
  $('ph-foot').innerHTML = `點通知卡會直接打開 /gov 的這一件事件。<br>
    本輪為<b>明示模擬</b>：沒有 Web Push、沒有 APNs、關掉分頁不會收到任何東西。<br>
    營運端會收到同一件事件的警示（政府端按「要求營運處理」時送出）。`;
}
function phoneGo(id){ phoneClose(); ovClose(); mxClose(); openEvent(id); }
/* 深連結：/gov?event=<id> */
function deepLink(){ const q=new URLSearchParams(location.search); const id=q.get('event'); if(id) openEvent(id); }

(async()=>{ const st = await API.get('/api/state'); kpis(st.kpi); await loadStations(); await loadAlerts(); brief(); deepLink(); })();
</script></body></html>
